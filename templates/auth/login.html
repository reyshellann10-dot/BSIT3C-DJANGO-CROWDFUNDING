{% extends 'theme/base.html' %}
{% block content %}
<div class="page page-center" style="min-height: 100vh; display: flex; align-items: center; justify-content: center;">
    <div class="container container-tight py-4">
        <div class="text-center mb-4">
            <a href="." class="navbar-brand navbar-brand-autodark">
                <h1 class="text-white fw-bold fs-1">Crowdfunding<span class="text-warning">V3</span></h1>
            </a>
            <p class="text-muted mt-2">Welcome back! Please sign in to your account.</p>
        </div>
        <div class="card card-md shadow-lg" style="border-radius: 15px; background-color: #1e293b; border: 1px solid #334155;">
            <div class="card-body p-5">
                <form method="POST" autocomplete="off" novalidate>
                    {% csrf_token %}
                    
                    {% if error %}
                    <div class="alert alert-danger mb-3">{{ error }}</div>
                    {% endif %}

                    <div class="mb-3">
                        <label class="form-label fw-bold text-white">Username</label>
                        <div class="input-group input-group-flat">
                            <span class="input-group-text bg-dark"><i class="fas fa-user text-muted"></i></span>
                            <input type="text" name="username" class="form-control bg-dark text-white" placeholder="Enter your username" required>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label fw-bold text-white">Password</label>
                        <div class="input-group input-group-flat">
                            <span class="input-group-text bg-dark"><i class="fas fa-lock text-muted"></i></span>
                            <input type="password" name="password" class="form-control bg-dark text-white" placeholder="Your password" required>
                        </div>
                    </div>

                    <div class="form-footer">
                        <button type="submit" class="btn btn-success w-100 py-2 fw-bold fs-5" style="border-radius: 10px;">
                            Sign in <i class="fas fa-arrow-right ms-2"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <div class="text-center text-muted mt-3">
            Don't have an account yet? <a href="{% url 'register' %}" class="text-success fw-bold">Sign up</a>
        </div>
    </div>
</div>
{% endblock %}
