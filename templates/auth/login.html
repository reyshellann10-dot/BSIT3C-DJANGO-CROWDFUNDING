{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <title>
    Sign in - Crowd Funding
  </title>
  <link href="{% static 'libs/jsvectormap/dist/jsvectormap.css' %}" rel="stylesheet" />
  <link href="{% static 'css/tabler.css' %}" rel="stylesheet" />
  <link href="{% static 'css/tabler-flags.css' %}" rel="stylesheet" />
  <link href="{% static 'css/tabler-socials.css' %}" rel="stylesheet" />
  <link href="{% static 'css/tabler-payments.css' %}" rel="stylesheet" />
  <link href="{% static 'css/tabler-vendors.css' %}" rel="stylesheet" />
  <link href="{% static 'css/tabler-marketing.css' %}" rel="stylesheet" />
  <link href="{% static 'css/tabler-themes.css' %}" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
  <script src="{% static 'js/tabler-theme.js' %}"></script>
  <div class="page page-center">
    <div class="container container-tight py-4">

     <div class="card card-md">
      <div class="card-body">

        <center class="mt-n4">
        <i class='far fa-calendar' style='font-size:40px'></i>
        </center>
        <h2 class="h3 text-center mb-4">Sign in to start your session</h2>

        <form method="post">
          {% csrf_token %}

          {% if messages %}
          <div id="error-message" class="alert alert-danger">
            {% for message in messages %}
            {{ message }}<br>
            {% endfor %}
          </div>
          {% endif %}
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" class="form-control" name="username" autocomplete="off" {% if locked %}disabled{% endif %}>
          </div>
          <div class="mb-2">
            <label class="form-label">
              Password
            </label>
            <div class="input-group input-group-flat">
              <input type="password" class="form-control" name="password" autocomplete="off" {% if locked %}disabled{% endif %}>
            </div>
          </div>
          <div class="form-footer d-flex justify-content-end">
            <button type="submit" class="btn btn-primary w-50">
              <i class="fas fa-sign-in-alt me-1"></i> Sign in
            </button>
          </div>
       </form>
     </div>
   </div>
 </div>
 <!-- <div class="text-center text-secondary mt-n1">
  Don't have an account?
  <a href="{% url 'register' %}" class="text-primary fw-bold">Register</a>
 </div> -->
</div>

{% include 'theme/settings.html' %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'js/tabler.js' %}" defer></script>
{% if locked %}
<script>
  let remaining = {{ remaining }};
  const messageBox = document.getElementById("error-message");

  if (messageBox) {
    let interval = setInterval(function() {
      remaining--;

      if (remaining > 0) {
        messageBox.innerHTML =
        "Too many failed attempts. Try again in " + remaining + " seconds.";
      } else {
        clearInterval(interval);
        window.location.href = "{% url 'login' %}";
      }

    }, 1000);
  } else {
    setTimeout(function() {
      window.location.href = "{% url 'login' %}";
    }, {{ remaining }} * 1000);
  }
</script>
{% endif %}
</body>
</html>
