{% extends 'theme/base.html' %}

{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card mt-4">
            <div class="card-header">
                <h3 class="card-title">{{ title }}</h3>
            </div>
            <div class="card-body">
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    <!-- Ito ang maglalabas ng form fields (Title, Target Amount, Image, etc.) -->
                    {{ form.as_p }}
                    
                    <div class="mt-3">
                        <button type="submit" class="btn btn-success">Save Project</button>
                        <a href="{% url 'campaigns:project_list' %}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
