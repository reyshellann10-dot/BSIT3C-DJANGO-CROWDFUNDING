{% extends 'theme/base.html' %}

{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card mt-4">
            <div class="card-header">
                <h3 class="card-title">{{ title }}</h3>
            </div>
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    
                    <!-- BAHAGI 1: INVESTOR DETAILS -->
                    <h4 class="mb-3 text-primary"><i class="fas fa-user"></i> Step 1: Investor Details</h4>
                    {{ form.as_p }}
                    
                    <hr class="my-4">

                    <!-- BAHAGI 2: INVESTMENT DETAILS -->
                    <h4 class="mb-3 text-success"><i class="fas fa-coins"></i> Step 2: Investment Details</h4>
                    
                    {{ investment_form.as_p }} 
                    
                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary w-100">Save Investor & Investment</button>
                        <a href="{% url 'investors:dashboard' %}" class="btn btn-secondary w-100 mt-2">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
